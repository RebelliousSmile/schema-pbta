name: Release train

on:
  workflow_dispatch:
    inputs:
      provider_commit:
        description: Immutable schema-pbta commit named by the train manifest
        required: true
        type: string
      config:
        description: Repository-relative immutable release-train manifest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-train-${{ inputs.provider_commit }}-${{ inputs.config }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate immutable release-train input
        run: npm run validate:release-train -- "${{ inputs.config }}"
      - name: Verify candidate ancestry
        run: git merge-base --is-ancestor "${{ inputs.provider_commit }}" HEAD
      - name: Run consumer-owned candidate proofs
        run: npx --no-install tsx tools/run-release-train.ts "${{ inputs.config }}" --workspace release-train-workspace --output release-train.provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-train-provenance
          path: release-train.provenance.json
