name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Stage a candidate or promote a proven candidate
        required: true
        type: choice
        options: [stage, promote]
      provider_commit:
        description: Immutable schema-pbta commit named by the train manifest
        required: true
        type: string
      config:
        description: Repository-relative immutable release-train manifest
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.mode }}-${{ inputs.provider_commit }}-${{ inputs.config }}
  cancel-in-progress: true

jobs:
  stage:
    if: inputs.mode == 'stage'
    runs-on: ubuntu-latest
    env:
      STAGE_CONFIG: /tmp/schema-pbta-release-stage.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:release-stage -- "${{ inputs.config }}"
      - name: Verify manifest provenance and isolate provider source
        env:
          CONFIG: ${{ inputs.config }}
          PROVIDER_COMMIT: ${{ inputs.provider_commit }}
        run: |
          candidate_commit="$(node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(JSON.parse(fs.readFileSync(process.env.CONFIG)).candidate.providerCommit)')"
          test "$candidate_commit" = "$PROVIDER_COMMIT"
          git merge-base --is-ancestor "$candidate_commit" HEAD
          cp "$CONFIG" "$STAGE_CONFIG"
          git checkout --detach "$candidate_commit"
          node --input-type=module -e 'import fs from "node:fs"; const c = JSON.parse(fs.readFileSync(process.env.STAGE_CONFIG)); const p = JSON.parse(fs.readFileSync("package.json")); if (c.candidate.finalTag !== `v${p.version}`) process.exit(1)'
      - run: npm ci
      - name: Build and verify the staged final-version archive
        env:
          CONFIG: /tmp/schema-pbta-release-stage.json
        run: |
          npx --no-install tsx tools/prepare-release.ts --output release-assets
          expected="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync(process.env.CONFIG)).candidate.sha256)')"
          expected_integrity="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync(process.env.CONFIG)).candidate.integrity)')"
          archive="release-assets/$(node -p "require('./package.json').name")-$(node -p "require('./package.json').version").tgz"
          actual="$(sha256sum "$archive" | cut -d " " -f 1)"
          actual_integrity="$(node --input-type=module -e 'import fs from "node:fs"; import { createHash } from "node:crypto"; console.log("sha512-" + createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$archive")"
          test "$actual" = "$expected"
          test "$actual_integrity" = "$expected_integrity"
          npm run validate:package -- "$archive"
      - name: Publish the immutable candidate asset
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CONFIG: /tmp/schema-pbta-release-stage.json
        run: |
          staging_tag="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync(process.env.CONFIG)).candidate.stagingTag)')"
          archive="release-assets/$(node -p "require('./package.json').name")-$(node -p "require('./package.json').version").tgz"
          ! gh release view "$staging_tag" >/dev/null 2>&1
          ! git ls-remote --exit-code --tags origin "refs/tags/$staging_tag" >/dev/null 2>&1
          gh release create "$staging_tag" --prerelease --target "${{ inputs.provider_commit }}" --generate-notes --title "schema-pbta candidate $staging_tag" "$archive" "${archive}.sha256"
          test "$(gh release view "$staging_tag" --json isPrerelease,isImmutable --jq '.isPrerelease and .isImmutable')" = "true"

  promote:
    if: inputs.mode == 'promote'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run validate:release-train -- "${{ inputs.config }}"
      - name: Verify manifest provenance and package version
        env:
          CONFIG: ${{ inputs.config }}
          PROVIDER_COMMIT: ${{ inputs.provider_commit }}
        run: |
          git merge-base --is-ancestor "$PROVIDER_COMMIT" HEAD
          node --input-type=module -e 'import fs from "node:fs"; const c = JSON.parse(fs.readFileSync(process.env.CONFIG)); const p = JSON.parse(fs.readFileSync("package.json")); if (c.candidate.providerCommit !== process.env.PROVIDER_COMMIT || c.candidate.finalTag !== `v${p.version}`) process.exit(1)'
      - name: Provision Obsidian 1.13.7 host proof
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python3 -m pip install websocket-client
          curl -fsSL -o /tmp/Obsidian.AppImage https://github.com/obsidianmd/obsidian-releases/releases/download/v1.13.7/Obsidian-1.13.7.AppImage
          chmod +x /tmp/Obsidian.AppImage
          cd /tmp
          ./Obsidian.AppImage --appimage-extract >/dev/null
      - name: Require both consumer proofs for the staged archive
        env:
          HANDBOOK_E2E_OBSIDIAN: /tmp/squashfs-root/AppRun
        run: npx --no-install tsx tools/run-release-train.ts "${{ inputs.config }}" --workspace release-train-workspace --output release-train.provenance.json
      - name: Download and verify the already staged bytes
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          url="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync(process.env.CONFIG)).candidate.releaseUrl)')"
          expected="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync(process.env.CONFIG)).candidate.sha256)')"
          expected_integrity="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync(process.env.CONFIG)).candidate.integrity)')"
          archive="schema-pbta-$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync(process.env.CONFIG)).candidate.finalTag.slice(1))').tgz"
          curl --fail --location --output "$archive" "$url"
          curl --fail --location --output "$archive.sha256" "$url.sha256"
          (sha256sum --check "$archive.sha256")
          test "$(sha256sum "$archive" | cut -d " " -f 1)" = "$expected"
          test "$(node --input-type=module -e 'import fs from "node:fs"; import { createHash } from "node:crypto"; console.log("sha512-" + createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$archive")" = "$expected_integrity"
      - name: Attach the verified bytes to a new immutable final tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CONFIG: ${{ inputs.config }}
          PROVIDER_COMMIT: ${{ inputs.provider_commit }}
        run: |
          final_tag="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync(process.env.CONFIG)).candidate.finalTag)')"
          archive="schema-pbta-${final_tag#v}.tgz"
          ! gh release view "$final_tag" >/dev/null 2>&1
          ! git ls-remote --exit-code --tags origin "refs/tags/$final_tag" >/dev/null 2>&1
          gh release create "$final_tag" --target "$PROVIDER_COMMIT" --generate-notes --title "schema-pbta ${final_tag#v}" "$archive" "$archive.sha256"
          test "$(gh release view "$final_tag" --json isImmutable --jq .isImmutable)" = "true"
          mkdir final-release
          gh release download "$final_tag" --pattern "$archive" --dir final-release
          expected="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync(process.env.CONFIG)).candidate.sha256)')"
          test "$(sha256sum "final-release/$archive" | cut -d " " -f 1)" = "$expected"
