# Monster of the Week — game definition.
#
# The character and NPC blocks are transcribed from the sheet preset published
# on the Asacolips wiki (`Sheet-Presets`, Monster of the Week), which is itself
# based on the rules written by Michael Sands and published by Evil Hat. Where
# the preset carries two ways of writing one thing, the convention of this
# repository keeps one; nothing else is changed, keys included — `class` really
# is what the preset calls the playbook move group.
#
# The `fronts` block has no counterpart upstream: the system models no front.
# Its countdown steps are read off the publisher's own mystery worksheet, its
# threat types and motivations off the Keeper reference sheets.
#
# No `$schema` key: the generated schemas carry `additionalProperties: false`
# at the root, and the key would fail validation.

game = "monster-of-the-week"
name = "Monster of the Week"
version = "1.0.0"
source = "Sheet preset for the Foundry `pbta` system, wiki page Sheet-Presets"
rollFormula = "2d6"

# Kept as the preset writes them, `6-` included: an open lower bound is a form
# the schema accepts, and rewriting it as `0-6` would be a silent edit.
[rollResults.success]
range = "10+"
label = "Success!"

[rollResults.partial]
range = "7-9"
label = "Partial success"

[rollResults.failure]
range = "6-"
label = "Miss..."

[character]
description = "A hunter: someone who has seen what is out there and goes back anyway."

[character.stats]
cool = "Cool"
tough = "Tough"
charm = "Charm"
sharp = "Sharp"
weird = "Weird"

[character.moveTypes]
basic = "Basic Moves"
class = "Playbook Moves"

[character.equipmentTypes]
gear = "Gear"
weapon = "Weapons"
transport = "Transport"
armour = "Armour"

[character.attributes.harm]
type = "Clock"
label = "Harm"
description = "When you reach 4 or more, mark unstable."
max = 7
position = "top"

[character.attributes.unstable]
type = "Checkbox"
label = "Unstable"
checkboxLabel = "Unstable Injuries"
description = "(Unstable injuries will worsen as time passes)"
default = false
position = "top"

[character.attributes.luck]
type = "Clock"
label = "Luck"
description = "Mark luck to change a roll to 12 or avoid all harm."
max = 7
default = 0
position = "top"

[character.attributes.xp]
type = "Xp"
label = "Experience"
description = "When you roll a miss, or when a move says to, mark Xp."
max = 5
default = 0
position = "top"

# No `position` in the preset either: the sidebar takes it, and the schema
# makes the key optional for exactly this case.
[character.attributes.armour]
type = "Number"
label = "Armour"
description = "Armour reduces harm suffered by the armour rating."
default = 0

[character.attributes.luckSpecial]
type = "LongText"
label = "Luck Special"
position = "left"

[character.attributes.look]
type = "LongText"
label = "Look"
position = "left"

[character.attributes.improvements]
type = "LongText"
label = "Improvements"
position = "left"

[character.attributes.advancedImprovements]
type = "LongText"
label = "Advanced Improvements"
position = "left"

[npc]
description = "A monster, a minion, a bystander or a place — anything a mystery puts in the hunters' way."

[npc.moveTypes]
custom = "Custom Moves"

[npc.equipmentTypes]
gear = "Gear"

# `harm` is a Resource here where the character block makes it a Clock: the
# same key, two attribute types, one game, straight from the preset. The
# attribute union takes the mix without a change, which is the point of
# discriminating on `type` rather than on the key.
[npc.attributes.harm]
type = "Resource"
label = "Harm Capacity"
position = "top"

[npc.attributes.armour]
type = "Number"
label = "Armour"
default = 0
position = "top"

[npc.attributes.type]
type = "ListMany"
label = "NPC Type"
options = ["Monster", "Minion", "Bystander", "Location"]
position = "top"

[npc.attributes.powers]
type = "LongText"
label = "Drive"
position = "left"

[npc.attributes.attacks]
type = "LongText"
label = "Attacks"
position = "left"

[npc.attributes.weakness]
type = "LongText"
label = "Weakness"
position = "left"

[npc.attributes.desc]
type = "LongText"
label = "Description"
position = "left"

[npc.attributes.motivation]
type = "LongText"
label = "Motivation"
position = "left"

# Threat vocabularies, this repository's addition. `threatTypes` holds the
# types a threat is picked from — the four categories of `npc.attributes.type`
# are their headings — and `impulses` the motivations that come with them, this
# game's name for what the front schema calls an impulse.

[fronts.threatTypes]
beast = "Monster: Beast"
breeder = "Monster: Breeder"
collector = "Monster: Collector"
destroyer = "Monster: Destroyer"
devourer = "Monster: Devourer"
executioner = "Monster: Executioner"
parasite = "Monster: Parasite"
queen = "Monster: Queen"
sorcerer = "Monster: Sorcerer"
tempter = "Monster: Tempter"
torturer = "Monster: Torturer"
trickster = "Monster: Trickster"
assassin = "Minion: Assassin"
brute = "Minion: Brute"
cultist = "Minion: Cultist"
guardian = "Minion: Guardian"
rightHand = "Minion: Right hand"
plague = "Minion: Plague"
renfield = "Minion: Renfield"
scout = "Minion: Scout"
thief = "Minion: Thief"
traitor = "Minion: Traitor"
busybody = "Bystander: Busybody"
detective = "Bystander: Detective"
gossip = "Bystander: Gossip"
helper = "Bystander: Helper"
innocent = "Bystander: Innocent"
official = "Bystander: Official"
skeptic = "Bystander: Skeptic"
victim = "Bystander: Victim"
witness = "Bystander: Witness"
crossroads = "Location: Crossroads"
deathtrap = "Location: Deathtrap"
den = "Location: Den"
fortress = "Location: Fortress"
hellgate = "Location: Hellgate"
hub = "Location: Hub"
lab = "Location: Lab"
maze = "Location: Maze"
prison = "Location: Prison"
wilds = "Location: Wilds"

[fronts.impulses]
toRunWild = "To run wild, destroying and killing"
toBreedEvil = "To bring forth or create evil"
toCollect = "To steal specific sorts of things"
toEndTheWorld = "To bring about the end of the world"
toConsumePeople = "To consume people"
toPunishTheGuilty = "To punish the guilty"
toInfest = "To infest, control and devour"
toPossess = "To possess and control"
toUsurpPower = "To usurp unnatural power"
toTempt = "To tempt people into evil deeds"
toTerrify = "To hurt and terrify"
toCreateChaos = "To create chaos"
toKillHunters = "To kill the hunters"
toIntimidate = "To intimidate and attack"
toSurvive = "To save their own skin at any cost"
toBarTheWay = "To bar a way or protect something"
toBackUpTheMonster = "To back up the monster"
toSwarm = "To swarm and destroy"
toPushVictims = "To push victims towards the monster"
toStalk = "To stalk, watch and report"
toStealAndDeliver = "To steal and deliver to the monster"
toBetray = "To betray people"
toInterfere = "To interfere in other people's plans"
toRuleOutExplanations = "To rule out explanations"
toPassOnRumours = "To pass on rumours"
toJoinTheHunt = "To join the hunt"
toDoTheRightThing = "To do the right thing"
toBeSuspicious = "To be suspicious"
toDenyTheSupernatural = "To deny supernatural explanations"
toBeEndangered = "To put themselves in danger"
toRevealInformation = "To reveal information"
toBringTogether = "To bring people, and things, together"
toHarmIntruders = "To harm intruders"
toHarbourMonsters = "To harbour monsters"
toDenyEntry = "To deny entry"
toCreateEvil = "To create evil"
toCreateWeirdness = "To create weirdness"
toConfuse = "To confuse and separate"
toConstrain = "To constrain and prevent exit"
