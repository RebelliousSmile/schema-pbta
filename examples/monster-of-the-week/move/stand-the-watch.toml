# Invented move, written for this repository.

slug = "stand-the-watch"
name = "Stand the Watch"
game = "monster-of-the-week"
moveType = "basic"
description = "Someone has to stay awake while the others sleep, and the thing outside knows it."
trigger = "When you keep watch through the night in a place you know is not safe, roll +Cool."

[roll]
rollType = "cool"

[results.success]
label = "10+"
text = "Nothing reaches the others, and you notice one thing about how it moves."

[results.partial]
label = "7-9"
text = "Nothing reaches the others, but the watch costs you: mark harm 1 or lose your next chance to rest."

[results.failure]
label = "Miss"
text = "You wake to find the watch already over, and something inside with you."
